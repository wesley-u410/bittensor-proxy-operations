image: golang:1.21

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ''
  DOCKER_BUILDKIT: 1
  CI_REF_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  CI_SHA_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  AR_REGISTRY: us-docker.pkg.dev
  AR_REGISTRY_IMAGE: $AR_REGISTRY/pc-deps/us.gcr.io/bittensor-proxy-operations
  AR_SHA_TAG: $AR_REGISTRY_IMAGE:$CI_COMMIT_SHA
  AR_SHA_TAG_LATEST: $AR_REGISTRY_IMAGE:latest

stages:
  - build
  - push

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH       # Default branch (`main`)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"  # Merge request

.build_deploy_template: &build_deploy_template
  image: google/cloud-sdk:latest
  services:
    - docker:20.10.17-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build:gitlab:
  <<: *build_deploy_template
  stage: build
  interruptible: true
  tags:
    - gcp
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - docker build -f "Dockerfile" -t $CI_SHA_TAG .
    - docker tag $CI_SHA_TAG $CI_REF_TAG
    - docker push $CI_SHA_TAG
    - docker push $CI_REF_TAG

push:artifact_registry:
  <<: *build_deploy_template
  stage: push
  interruptible: false
  tags:
    - gcp
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - gcloud auth configure-docker $AR_REGISTRY
    - docker pull $CI_SHA_TAG
    - docker tag $CI_SHA_TAG $AR_SHA_TAG
    - docker tag $CI_SHA_TAG $AR_SHA_TAG_LATEST
    - docker push $AR_SHA_TAG